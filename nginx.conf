# Preserve an upstream TLS proxy's X-Forwarded-Proto (https) if present,
# otherwise fall back to the scheme nginx itself is serving (http for the
# bundled local stack). The backend uses this to detect secure requests.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow product/image uploads through the proxied API (nginx defaults to 1m).
    client_max_body_size 10m;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Django admin / DRF static files. Collected into a shared volume by the
    # backend container at start-up and served directly by nginx.
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 7d;
    }

    # User-uploaded media, shared from the backend container via a volume.
    location /media/ {
        alias /usr/share/nginx/media/;
        access_log off;
        expires 7d;
    }

    # Proxy the API to the Django backend service (docker-compose network).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Must outlast gunicorn's --timeout 120 so slow requests (reports,
        # CSV exports) are not cut off early with a 504.
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
